name: Publish to npm

on:
  push:
    branches:
      - master

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build:all

      - name: Run tests
        run: yarn test:all

      - name: Bump patch version
        run: |
          for pkg in packages/react packages/forms packages/auth-ui; do
            cd $pkg
            npm version patch --no-git-tag-version
            cd $GITHUB_WORKSPACE
          done

      - name: Publish @blacksmith-ui/react
        run: yarn workspace @blacksmith-ui/react publish --non-interactive --no-git-tag-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blacksmith-ui/forms
        run: yarn workspace @blacksmith-ui/forms publish --non-interactive --no-git-tag-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blacksmith-ui/auth
        run: yarn workspace @blacksmith-ui/auth publish --non-interactive --no-git-tag-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          VERSION=$(node -p "require('./packages/react/package.json').version")
          git commit -m "chore: release v${VERSION} [skip ci]"
          git push
